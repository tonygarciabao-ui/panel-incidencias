<title>Panel Incidencias — Carretillas</title>
<style>
  :root {
    --bg:#0f172a;--surface:#1e293b;--border:#1e3a5f;
    --accent:#ef4444;--accent2:#f59e0b;--accent3:#22c55e;--blue:#3b82f6;
    --text:#e2e8f0;--muted:#ffffff;--light:#93c5fd;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
  header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:16px 28px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--surface),var(--bg));}
  .logo{display:flex;align-items:center;gap:16px;}
  .logo-icon{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),#dc2626);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-text h1{font-size:19px;font-weight:700;color:#f1f5f9;letter-spacing:-.3px;}
  .logo-text p{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:2px;}
  .header-right{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .update-info{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent3);}
  .header-stats{display:flex;gap:12px;}
  .stat-pill{display:flex;flex-direction:column;align-items:center;background:var(--surface);border-left:3px solid var(--border);border-radius:10px;padding:9px 20px;min-width:80px;}
  .stat-pill .num{font-size:24px;font-weight:800;line-height:1.1;}
  .stat-pill .label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:2px;}
  .stat-pill.red{border-left-color:var(--accent);}
  .stat-pill.red .num{color:var(--accent);}
  .stat-pill.amber{border-left-color:var(--accent2);}
  .stat-pill.amber .num{color:var(--accent2);}
  .stat-pill.green{border-left-color:var(--accent3);}
  .stat-pill.green .num{color:var(--accent3);}
  main{position:relative;z-index:5;padding:28px 28px 40px;}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
  .search-box{position:relative;flex:1;min-width:220px;}
  .search-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 16px 11px 38px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s;}
  .search-box input:focus{border-color:var(--blue);}
  .search-box input::placeholder{color:var(--muted);opacity:.55;}
  .search-box .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);opacity:.6;font-size:14px;}
  .filter-btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 16px;color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
  .filter-btn.active,.filter-btn:hover{border-color:var(--blue);color:#93c5fd;}
  .section-title{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:40px;}
  .card{background:var(--surface);border-radius:12px;overflow:hidden;transition:filter .15s;cursor:pointer;animation:fadeUp .35s ease backwards;}
  .card:hover{filter:brightness(1.08);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .card-header{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;}
  .carretilla-num{font-size:22px;font-weight:800;line-height:1.1;color:var(--light);}
  .carretilla-num span{font-size:10px;display:block;color:var(--muted);letter-spacing:1px;margin-bottom:3px;font-weight:600;}
  .badge-prioridad{display:inline-flex;align-items:center;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;flex-shrink:0;}
  .badge-prioridad.alta{background:rgba(239,68,68,.15);color:#fca5a5;}
  .badge-prioridad.media{background:rgba(245,158,11,.15);color:#fcd34d;}
  .badge-prioridad.baja{background:rgba(34,197,94,.15);color:#86efac;}
  .badge-prioridad.sin{background:rgba(255,255,255,.1);color:var(--muted);}
  .forklift-container{padding:12px 18px;display:flex;justify-content:center;align-items:center;min-height:100px;overflow:visible;}
  .card-body{padding:0 18px 16px;}
  .incidencia-text{font-size:13px;font-weight:500;color:var(--text);margin-bottom:11px;line-height:1.5;border-left:3px solid var(--accent2);padding-left:9px;}
  .meta-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;}
  .meta-chip{background:#0f172a;border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .meta-chip strong{color:var(--text);font-weight:600;}
  .card-footer{border-top:1px solid var(--border);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;}
  .estado-pendiente{font-size:10px;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .usuario{font-size:11px;color:var(--muted);font-weight:500;}
  .empty-state{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted);font-size:13px;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;backdrop-filter:blur(4px);}
  .overlay.active{display:flex;align-items:center;justify-content:center;}
  .detail-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:slideIn .2s ease;position:relative;}
  @keyframes slideIn{from{opacity:0;transform:scale(.96) translateY(14px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .close-btn{position:absolute;top:14px;right:14px;background:#0f172a;border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .close-btn:hover{color:#fff;border-color:var(--blue);}
  .detail-title{font-size:22px;font-weight:800;color:var(--light);margin-bottom:4px;}
  .detail-sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:20px;}
  .detail-forklift{display:flex;justify-content:center;margin-bottom:20px;}
  .veh-photo{background:#f4f4f4;border-radius:12px;padding:10px;box-shadow:0 8px 20px rgba(0,0,0,.35);display:inline-flex;}
  .veh-photo img{display:block;border-radius:7px;object-fit:contain;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;}
  .detail-field{background:#0f172a;border-radius:8px;padding:10px 12px;border-left:3px solid var(--border);}
  .detail-field label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:4px;}
  .detail-field .val{font-size:13px;font-weight:600;color:var(--text);}
  .detail-incidencia{background:#0f172a;border-left:3px solid var(--accent2);border-radius:8px;padding:14px;margin-bottom:9px;}
  .detail-incidencia label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent2);display:block;margin-bottom:5px;font-weight:700;}
  .detail-incidencia .val{font-size:14px;font-weight:500;color:var(--text);line-height:1.5;}
  .detail-obs{background:#0f172a;border-radius:8px;padding:12px 14px;border-left:3px solid var(--border);}
  .detail-obs label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:5px;}
  .detail-obs .val{font-size:12px;color:var(--muted);line-height:1.5;}

  @media(max-width:600px){
    header{padding:14px 18px;}
    main{padding:18px 14px;}
    .grid{grid-template-columns:1fr;}
    .header-stats{gap:8px;}
    .stat-pill{padding:7px 12px;min-width:60px;}
    .stat-pill .num{font-size:19px;}
    .forklift-container{min-height:70px;padding:10px 14px;}
    .carretilla-num{font-size:18px;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .search-box{min-width:unset;}
  }
  </style>
</head>

var JSON_URL = 'https://default4c49bed785da470cafc37735b371a3.43.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/24/workflows/f62cce79b444494aad955507360db643/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=VSWqnfDZqHEbg9rOCYfYYKl3DPhroUBpsK0QDDIWcQA';
var incidencias = [];
var allRows = []; // TODO el historico (pendientes y solucionadas), para la ficha de vehiculo por QR
var activeFilter = 'all';
var lastTotalRows = null;

function excelDate(s){
  if(!s||isNaN(s))return s||'—';
  var d=new Date((parseInt(s)-25569)*86400*1000);
  if(isNaN(d.getTime()))return String(s);
  return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
}
// Version numerica de excelDate, para poder ORDENAR el historial por fecha
// real en vez de por el texto ya formateado (que no ordena bien).
function excelDateRaw(s){
  if(s===undefined||s===null||s==='')return null;
  var str=String(s).trim();
  if(/^\d+(\.\d+)?$/.test(str)){
    return (parseFloat(str)-25569)*86400*1000;
  }
  var d=new Date(s);
  return isNaN(d.getTime())?null:d.getTime();
}

// El campo de responsable llega con caracteres especiales codificados por
// Power Automate (p.ej. "JJEE / AUX_x002e_ DESC_x002e_" en vez de
// "JJEE / AUX. DESC."), asi que se busca por coincidencia parcial ademas
// del nombre exacto, para no depender de la codificacion concreta.
function getField(item, ...possibleNames){
  for(var i=0;i<possibleNames.length;i++){if(item[possibleNames[i]]!==undefined)return item[possibleNames[i]];}
  var keys=Object.keys(item);
  for(var j=0;j<possibleNames.length;j++){
    var found=keys.find(function(k){return k.toLowerCase().includes(possibleNames[j].toLowerCase().substring(0,5));});
    if(found)return item[found];
  }
  return '';
}

// La respuesta puede venir en distintas formas segun como este montada la
// accion "Respuesta" en Power Automate: array directo, {datos:[...]} o
// {value:[...]} (tipico de "Obtener filas"). Se aceptan las tres.
function extractRows(data){
  if(Array.isArray(data))return data;
  if(data&&Array.isArray(data.datos))return data.datos;
  if(data&&Array.isArray(data.value))return data.value;
  return null;
}

// El campo llega de Power Automate en formatos distintos segun el conector
// (booleano nativo true/false, texto "true"/"TRUE", "Sí"/"1"...), asi que se
// normaliza aqui en vez de asumir un unico formato.
function isChecked(v){
  if(v===true)return true;
  if(v===false||v===undefined||v===null)return false;
  var s=String(v).trim().toLowerCase();
  return s==='true'||s==='verdadero'||s==='sí'||s==='si'||s==='1'||s==='x'||s==='yes';
}
async function loadData(){
  try{
    var response=await fetch(JSON_URL);
    var rawText=await response.text();

    if(!response.ok){
      showError('El servidor respondio con un error (HTTP '+response.status+' '+response.statusText+').','Puede que el flujo de Power Automate este deshabilitado o la URL haya caducado.',rawText);
      return;
    }
    var data;
    try{ data=JSON.parse(rawText); }
    catch(parseErr){
      showError('La respuesta no es JSON valido.','Esto pasa si la URL apunta a un archivo en vez de al flujo de Power Automate, o si devolvio un error HTML.',rawText);
      return;
    }
    var rows=extractRows(data);
    if(rows===null){
      showError('La respuesta es JSON valido pero no tiene la forma esperada.','Claves recibidas: '+Object.keys(data||{}).join(', '),JSON.stringify(data,null,2).slice(0,2000));
      return;
    }

    var pend=rows.filter(function(r){return String(getField(r,'ESTADO REPARACION')||'').toLowerCase().trim()==='pendiente';});
    lastTotalRows=rows.length;
    incidencias=pend.map(function(r,i){return{
      id:i,
      carretilla:getField(r,'CARRETILLA')||'?',
      usuario:getField(r,'USUARIO')||'—',
      incidencia:getField(r,'INCIDENCIA')||'—',
      fechaAveria:excelDate(getField(r,'FECHA AVERIA')),
      fechaAviso:excelDate(getField(r,'FECHA AVISO\n Javier 71908')),
      responsable:getField(r,'JJEE / AUX_x002e_ DESC_x002e_','JJEE','AUX')||'—',
      avisadoJavier:isChecked(getField(r,'AVISADO JAVIER','AVISADO')),
      prioridad:getField(r,'PRIORIDAD')||'',
      estado:getField(r,'ESTADO REPARACION')||'—',
      observaciones:getField(r,'OBSERVACIONES')||''
    };});
    // Historial completo (todas las filas, no solo pendientes), para la
    // ficha de vehiculo a la que se llega escaneando el QR de cada carretilla.
    allRows=rows.map(function(r,i){return{
      idx:i,
      carretilla:getField(r,'CARRETILLA')||'?',
      usuario:getField(r,'USUARIO')||'—',
      incidencia:getField(r,'INCIDENCIA')||'—',
      fechaAveria:excelDate(getField(r,'FECHA AVERIA')),
      fechaAveriaRaw:excelDateRaw(getField(r,'FECHA AVERIA')),
      fechaAviso:excelDate(getField(r,'FECHA AVISO\n Javier 71908')),
      responsable:getField(r,'JJEE / AUX_x002e_ DESC_x002e_','JJEE','AUX')||'—',
      avisadoJavier:isChecked(getField(r,'AVISADO JAVIER','AVISADO')),
      prioridad:getField(r,'PRIORIDAD')||'',
      estado:getField(r,'ESTADO REPARACION')||'—',
      fechaArreglo:excelDate(getField(r,'FECHA ARREGLO')),
      observaciones:getField(r,'OBSERVACIONES')||''
    };});
    document.getElementById('stat-total').textContent=incidencias.length;
    document.getElementById('stat-alta').textContent=incidencias.filter(function(i){return(i.prioridad||'').toUpperCase()==='ALTA';}).length;
    document.getElementById('stat-resto').textContent=incidencias.filter(function(i){return(i.prioridad||'').toUpperCase()!=='ALTA';}).length;
    // Si la URL trae ?carretilla=CODIGO (por ejemplo, al escanear el QR
    // pegado en una carretilla concreta), se muestra su ficha completa en
    // vez del listado general de toda la flota.
    var urlCar=new URLSearchParams(location.search).get('carretilla');
    if(urlCar){renderVehiclePage(urlCar);}else{renderGrid();}
    updateSyncInfo(true);
  }catch(error){
    // Esto es lo que salta con un bloqueo CORS: el navegador no deja ni
    // empezar a leer la respuesta, solo se ve "Failed to fetch".
    showError('No se pudo conectar con el flujo ('+error.message+').','La causa mas probable es CORS: el flujo debe devolver "Access-Control-Allow-Origin: *". Revisa la consola del navegador (F12) para el error exacto.','');
    updateSyncInfo(false);
  }
}

function showError(title,hint,raw){
  document.getElementById('grid').innerHTML='<div class="empty-state">❌ '+title+'<br><span style="font-size:11px">'+hint+'</span>'+(raw?'<pre style="text-align:left;background:#0f172a;padding:10px;border-radius:8px;font-size:10px;overflow-x:auto;margin-top:10px;white-space:pre-wrap;word-break:break-all">'+String(raw).slice(0,1200).replace(/</g,'&lt;')+'</pre>':'')+'</div>';
}

function updateSyncInfo(ok){
  var now=new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var extra=(ok&&lastTotalRows!==null)?' · '+lastTotalRows+' filas recibidas':'';
  document.getElementById('fecha-gen').textContent=now+extra;
  var dot=document.getElementById('live-dot');
  if(dot)dot.style.background=ok?'var(--accent3)':'var(--accent)';
}

// Clasificacion por prefijo del codigo de carretilla, tal cual la lista de
// validacion del Excel de registro: APIL=apilador, BAT=cambio de bateria,
// C=carretilla, T=transpale. El orden importa poco aqui porque las cuatro
// letras iniciales no se solapan entre si.
function vehicleType(carretilla){
  var s=String(carretilla||'').trim().toUpperCase();
  if(/^APIL/.test(s))return'apilador';
  if(/^BAT/.test(s))return'bateria';
  if(/^C/.test(s))return'carretilla';
  if(/^T/.test(s))return'transpale';
  return'generico';
}
function vehicleLabel(carretilla){
  var t=vehicleType(carretilla);
  return t==='carretilla'?'Carretilla':t==='transpale'?'Transpalé':t==='apilador'?'Apilador':t==='bateria'?'Cambio batería':'Otro';
}
function vehicleColor(carretilla){
  var t=vehicleType(carretilla);
  return t==='carretilla'?'#3b82f6':t==='transpale'?'#a855f7':t==='apilador'?'#06b6d4':t==='bateria'?'#f59e0b':'#94a3b8';
}
function getVehicleImg(carretilla,w,h){
  // Solo hay fotos reales de carretilla y transpale. Apilador/cambio de
  // bateria muestran un icono generico atenuado hasta que se añadan sus
  // propias fotos (mismo patron que ya usamos para carretilla y transpale).
  var t=vehicleType(carretilla);
  var src=t==='transpale'?IMG_TRANSPALETA:t==='carretilla'?IMG_FORKLIFT:t==='apilador'?IMG_APILADOR:IMG_GENERIC;
  // Cambio de bateria y cualquier otro no reconocido siguen con el icono
  // generico atenuado hasta que haya una foto propia.
  var opacity=(t==='bateria'||t==='generico')?'opacity:0.5;filter:brightness(0) invert(0.6);':'';
  return'<div class="veh-photo"><img src="'+src+'" width="'+w+'" height="'+h+'" style="'+opacity+'"></div>';
}
function svgColor(p){p=(p||'').toLowerCase();if(p==='alta')return'#ef4444';if(p==='media')return'#f59e0b';if(p==='baja')return'#22c55e';return'#888';}
function badgeClass(p){p=(p||'').toLowerCase();if(p==='alta')return'alta';if(p==='media')return'media';if(p==='baja')return'baja';return'sin';}

function buildCard(item,delay){
  var col=svgColor(item.prioridad);
  var vc=vehicleColor(item.carretilla);
  return '<div class="card" style="animation-delay:'+delay+'ms;border-color:'+col+';border-width:2px" onclick="openDetail('+item.id+')">'+
    '<div class="card-header">'+
      '<div><div class="carretilla-num"><span>'+vehicleLabel(item.carretilla).toUpperCase()+'</span>'+(item.carretilla||'?')+'</div>'+
      '<span style="display:inline-block;margin-top:5px;padding:2px 9px;border-radius:5px;font-size:10px;font-weight:700;background:'+vc+'22;color:'+vc+'">'+vehicleLabel(item.carretilla)+'</span></div>'+
      '<div class="badge-prioridad '+badgeClass(item.prioridad)+'">'+(item.prioridad||'Sin prioridad')+'</div>'+
    '</div>'+
    '<div class="card-body">'+
      '<div class="incidencia-text">'+item.incidencia+'</div>'+
      '<div class="meta-row">'+
        '<div class="meta-chip">📅 <strong>'+item.fechaAveria+'</strong></div>'+
        '<div class="meta-chip">📣 <strong>'+item.fechaAviso+'</strong></div>'+
        '<div class="meta-chip" style="'+(item.avisadoJavier?'border-color:#22c55e55;color:#86efac':'border-color:#94a3b855')+'">'+(item.avisadoJavier?'☑':'☐')+' <strong>'+(item.avisadoJavier?'Avisado a Javier':'Javier sin avisar')+'</strong></div>'+
      '</div>'+
    '</div>'+
    '<div class="card-footer">'+
      '<div class="estado-pendiente">⬤ '+item.estado+'</div>'+
      '<div class="usuario">👤 '+item.usuario+'</div>'+
    '</div>'+
  '</div>';
}

// Ficha completa de UNA carretilla, a la que se llega por el QR pegado en
// el propio vehiculo (?carretilla=CODIGO en la URL). Muestra primero lo
// pendiente (o un aviso claro de que no hay nada pendiente) y despues el
// historial completo, incluidas las ya solucionadas.
function renderVehiclePage(carCodeRaw){
  var toolbar=document.getElementById('toolbar');if(toolbar)toolbar.style.display='none';
  var sectionAll=document.getElementById('section-title-all');if(sectionAll)sectionAll.style.display='none';
  var carCode=String(carCodeRaw||'').trim();
  var carUp=carCode.toUpperCase();
  var mine=allRows.filter(function(r){return String(r.carretilla).trim().toUpperCase()===carUp;});
  mine.sort(function(a,b){return(b.fechaAveriaRaw||0)-(a.fechaAveriaRaw||0);});
  var pendientes=incidencias.filter(function(i){return String(i.carretilla).trim().toUpperCase()===carUp;});

  var vLabel=vehicleLabel(carCode),vColor=vehicleColor(carCode);
  var pendHtml=pendientes.length
    ? '<div class="grid">'+pendientes.map(function(item,i){return buildCard(item,i*40);}).join('')+'</div>'
    : '<div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:18px;text-align:center;color:#86efac;font-weight:700">✅ Sin incidencias pendientes</div>';

  var histHtml=mine.length
    ? mine.map(function(r){
        var pend=r.estado.toLowerCase().trim()==='pendiente';
        var solu=r.estado.toLowerCase().indexOf('solucion')>=0;
        var col=pend?'#f59e0b':(solu?'#22c55e':'#94a3b8');
        return'<div class="card" style="cursor:pointer;margin-bottom:8px;padding:14px" onclick="openDetailObj(allRows['+r.idx+'])">'
          +'<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'
          +'<div style="flex:1;min-width:0"><div style="font-size:13px;color:var(--text);font-weight:600">'+r.incidencia+'</div>'
          +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+r.fechaAveria+' · '+r.usuario+(r.responsable&&r.responsable!=='—'?' · asignado a '+r.responsable:'')+(solu&&r.fechaArreglo&&r.fechaArreglo!=='—'?' · arreglado '+r.fechaArreglo:'')+'</div></div>'
          +'<span style="background:'+col+'22;color:'+col+';padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0">'+(r.estado||'—')+'</span>'
          +'</div></div>';
      }).join('')
    : '<div style="color:var(--muted);text-align:center;padding:20px">Sin historial registrado para esta carretilla.</div>';

  document.getElementById('content').innerHTML=
    '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:26px">'
    +getVehicleImg(carCode,110,80)
    +'<div><div style="font-size:28px;font-weight:800;color:var(--light)">'+carCode+'</div>'
    +'<span style="display:inline-block;margin-top:5px;padding:3px 11px;border-radius:5px;font-size:11px;font-weight:700;background:'+vColor+'22;color:'+vColor+'">'+vLabel+'</span></div>'
    +'</div>'
    +'<div class="section-title">Incidencias pendientes ('+pendientes.length+')</div>'+pendHtml
    +'<div class="section-title" style="margin-top:28px">Historial completo ('+mine.length+')</div>'+histHtml;
}
function renderGrid(){
  var search=(document.getElementById('search').value||'').toLowerCase();
  var filtered=incidencias.filter(function(i){
    var mf=activeFilter==='all'||(i.prioridad||'').toLowerCase()===activeFilter.toLowerCase();
    var ms=!search||(i.carretilla||'').toLowerCase().includes(search)||(i.usuario||'').toLowerCase().includes(search)||(i.incidencia||'').toLowerCase().includes(search);
    return mf&&ms;
  });
  var grid=document.getElementById('grid');
  if(!filtered.length){grid.innerHTML='<div class="empty-state">Sin incidencias que coincidan</div>';return;}
  grid.innerHTML=filtered.map(function(item,i){return buildCard(item,i*70);}).join('');
}

function setFilter(f){
  activeFilter=f;
  ['all','alta','media','baja'].forEach(function(k){var el=document.getElementById('btn-'+k);if(el)el.classList.remove('active');});
  var t=document.getElementById('btn-'+f.toLowerCase());if(t)t.classList.add('active');
  renderGrid();
}

var _detailOpen=false;
function openDetail(id){
  var item=incidencias.find(function(i){return i.id===id;});
  openDetailObj(item);
}
function openDetailObj(item){
  if(_detailOpen)return;
  _detailOpen=true;
  setTimeout(function(){_detailOpen=false;},300);
  if(!item)return;
  document.getElementById('d-num').textContent=vehicleLabel(item.carretilla).toUpperCase()+' '+item.carretilla;
  document.getElementById('d-tipo').textContent=vehicleLabel(item.carretilla)+' · '+(item.estado||'');
  document.getElementById('d-svg').innerHTML=getVehicleImg(item.carretilla,180,130);
  var fc=item.prioridad.toLowerCase()==='alta'?'brightness(0) saturate(100%) invert(35%) sepia(90%) saturate(2000%) hue-rotate(340deg) brightness(120%)':item.prioridad.toLowerCase()==='media'?'brightness(0) saturate(100%) invert(75%) sepia(80%) saturate(800%) hue-rotate(5deg) brightness(110%)':item.prioridad.toLowerCase()==='baja'?'brightness(0) saturate(100%) invert(60%) sepia(80%) saturate(800%) hue-rotate(90deg) brightness(110%)':'brightness(0) invert(0.5)';
  document.getElementById('d-inc').textContent=item.incidencia;
  document.getElementById('d-fa').textContent=item.fechaAveria;
  document.getElementById('d-fav').textContent=item.fechaAviso;
  document.getElementById('d-us').textContent=item.usuario;
  document.getElementById('d-re').textContent=item.responsable;
  document.getElementById('d-pr').textContent=item.prioridad||'Sin prioridad';
  document.getElementById('d-es').textContent=item.estado;
  var dav=document.getElementById('d-av');
  dav.textContent=(item.avisadoJavier?'☑ Sí, avisado':'☐ No avisado');
  dav.style.color=item.avisadoJavier?'#86efac':'#fca5a5';
  document.getElementById('d-ob').textContent=item.observaciones||'Sin observaciones';
  document.getElementById('overlay').classList.add('active');
}

function closeDetail(e,force){
  if(force||(e&&e.target===document.getElementById('overlay')))document.getElementById('overlay').classList.remove('active');
}

loadData();
setInterval(loadData, 60000);
</script>
